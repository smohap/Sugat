# Minimal Supabase CLI config. Enough for `supabase link` and `supabase db push`.
# For full local development (`supabase start`), which needs Docker, run
# `supabase init` in an empty directory and merge in the extra sections.

project_id = "sugather"

[api]
# PostgREST only serves schemas named here. `sugat` holds every application
# table and RPC (0001), so leaving it out makes the whole API 404 with
# PGRST106. The hosted project needs the same list under Settings → API →
# Exposed schemas; this section only governs `supabase start`.
schemas = ["public", "graphql_public", "sugat"]
extra_search_path = ["public", "extensions", "sugat"]

[db]
port = 54322
major_version = 17

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/**"]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
enable_confirmations = false
